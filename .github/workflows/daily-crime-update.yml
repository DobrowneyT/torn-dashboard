# .github/workflows/daily-crime-update.yml
name: Daily Crime Data Update

on:
  schedule:
    # Run daily at 6:00 AM UTC (adjust timezone as needed)
    - cron: '0 6 * * *'
  # Allow manual triggers from GitHub UI
  workflow_dispatch:

jobs:
  update-crime-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create Google Drive credentials file
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_DRIVE_CREDENTIALS" > google_credentials.json
        
    - name: Run daily crime update
      env:
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      run: |
        python scripts/daily_crime_update.py
        
    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: daily-update-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

---

# .github/workflows/cpr-scraper.yml
name: CPR Data Scraper

on:
  # Triggered by repository dispatch from Google Sheets
  repository_dispatch:
    types: [trigger-cpr-scrape]
  # Allow manual triggers from GitHub UI
  workflow_dispatch:
    inputs:
      member_filter:
        description: 'Specific member to scrape (optional, leave blank for all)'
        required: false
        default: ''

jobs:
  scrape-cpr-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create Google Drive credentials file
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_DRIVE_CREDENTIALS" > google_credentials.json
        
    - name: Update Sheets status to Processing
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        python scripts/update_sheet_status.py "Processing CPR scrape..."
        
    - name: Run CPR scraper
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        MEMBER_FILTER: ${{ github.event.inputs.member_filter }}
      run: |
        python scripts/cpr_scraper.py
        
    - name: Update Sheets status to Complete
      if: success()
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        python scripts/update_sheet_status.py "CPR scrape completed at $(date)"
        
    - name: Update Sheets status to Failed
      if: failure()
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        python scripts/update_sheet_status.py "CPR scrape failed - check logs"
        
    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: cpr-scrape-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

---

# .github/workflows/weekly-payout.yml
name: Weekly Payout Processing

on:
  # Manual trigger only - run when ready to process payouts
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Payout period start (YYYY-MM-DD)'
        required: true
      end_date:
        description: 'Payout period end (YYYY-MM-DD)'
        required: true
      dry_run:
        description: 'Dry run (calculate but do not update sheets)'
        required: false
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

jobs:
  process-weekly-payout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create Google Drive credentials file
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_DRIVE_CREDENTIALS" > google_credentials.json
        
    - name: Process weekly payout
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        START_DATE: ${{ github.event.inputs.start_date }}
        END_DATE: ${{ github.event.inputs.end_date }}
        DRY_RUN: ${{ github.event.inputs.dry_run }}
      run: |
        python scripts/weekly_payout.py
        
    - name: Upload payout results
      uses: actions/upload-artifact@v3
      with:
        name: payout-results-${{ github.event.inputs.start_date }}-to-${{ github.event.inputs.end_date }}
        path: |
          payout_results.json
          payout_summary.txt
        retention-days: 90

---

# .github/workflows/initial-setup.yml
name: Initial Historical Data Setup

on:
  # Manual trigger only - run once to populate historical data
  workflow_dispatch:
    inputs:
      start_from_beginning:
        description: 'Start from beginning of faction history'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      custom_start_date:
        description: 'Custom start date (YYYY-MM-DD) if not from beginning'
        required: false

jobs:
  initial-data-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create Google Drive credentials file
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_DRIVE_CREDENTIALS" > google_credentials.json
        
    - name: Run initial historical data collection
      env:
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        START_FROM_BEGINNING: ${{ github.event.inputs.start_from_beginning }}
        CUSTOM_START_DATE: ${{ github.event.inputs.custom_start_date }}
      run: |
        python scripts/initial_setup.py
        
    - name: Upload setup logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: initial-setup-logs-${{ github.run_number }}
        path: logs/
        retention-days: 90