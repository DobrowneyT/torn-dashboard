name: Changelog Gate

# Enforce the delivery workflow (#164/#165): a PR that changes source under
# frontend/, server/, or db/ should also add a CHANGELOG.md line (and, once
# past the batching phase, bump VERSION). See docs/agents/delivery-workflow.md.
#
# ⚠️ This job now has TWO checks with DIFFERENT severities:
#
#   1. VERSION matches every package.json — BLOCKING. There is no legitimate
#      mismatch, and one shipped undetected (see the step's own note).
#   2. The changelog gate — PHASE 1, WARN-ONLY: it annotates and writes a job
#      summary but never fails the PR, so we can confirm it doesn't misfire on
#      legitimate changes. PHASE 2: flip WARN_ONLY to 'false' (and
#      REQUIRE_VERSION when per-PR bumps become the norm).
#
# Either way the job is already worth adding to branch protection as a required
# status check — check 1 alone justifies it.

on:
  pull_request:
    # ⚠️ `main` as well as `dev`. A dev → main promotion is exactly when a
    # version mismatch would reach production, and it is the one PR shape that
    # was never checked.
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

# Same reasoning as tests.yml: one run per PR on a single self-hosted runner, so
# a superseded run queues ahead of the one that matters. This job takes four
# seconds, but it still has to wait its turn behind everything else.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-gate:
    name: Changelog + version check
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      # Phase 1 = warn-only. Set to 'false' to make the gate blocking.
      WARN_ONLY: 'true'
      # Whether a VERSION bump is also required. Kept 'false' during the
      # batching phase (changelog lines accumulate under [Unreleased]; VERSION
      # is bumped when a release is cut). Flip to 'true' to require a bump on
      # every source-touching PR.
      REQUIRE_VERSION: 'false'
    steps:
      # ⚠️ The checkout the changelog step never needed — it reads the PR through
      # the API. The version check reads the TREE, so it needs the files.
      - uses: actions/checkout@v4

      # ⚠️ **Blocking, unlike the changelog step above.** That one is warn-only
      # because a test-only PR legitimately needs no changelog line. There is no
      # such thing as a legitimate version mismatch: VERSION feeds the footer and
      # /api/health, the package files feed npm and the Docker builds, and when
      # they disagree the dashboard reports a version that was never built.
      #
      # This exists because it happened. PR #804 branched before another bump
      # landed, so its sed found nothing and VERSION said 3.146.0 while all four
      # package.json files said 3.144.1 — with this job green, because it only
      # ever checked that CHANGELOG.md had *changed*.
      - name: VERSION matches every package.json
        run: node scripts/check-version-sync.mjs

      - name: Evaluate the gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # ── Escape hatches for legit no-bump PRs (test-only, pure refactor…) ──
          if printf '%s' "$LABELS" | tr ',' '\n' | grep -qx 'no-changelog'; then
            echo "→ 'no-changelog' label present — gate skipped."; exit 0
          fi
          if printf '%s' "$BODY" | grep -qiF '[skip changelog]'; then
            echo "→ '[skip changelog]' marker in PR body — gate skipped."; exit 0
          fi

          # ── Which files did this PR change? ──────────────────────────────────
          # Never let an infra hiccup (token scope, API blip) fail the job — this
          # gate is advisory. Degrade to a skip instead.
          if ! files=$(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path'); then
            echo "→ could not read PR files (token scope / API) — gate skipped."; exit 0
          fi
          echo "Changed files:"; echo "$files" | sed 's/^/  /'

          # Source = anything under the three app workspaces.
          source_changed=$(printf '%s\n' "$files" | grep -E '^(frontend|server|db)/' || true)
          if [ -z "$source_changed" ]; then
            echo "→ No source under frontend/ server/ db/ changed — gate not applicable."
            exit 0
          fi

          changelog_changed=$(printf '%s\n' "$files" | grep -xF 'CHANGELOG.md' || true)
          version_changed=$(printf '%s\n' "$files" | grep -xF 'VERSION' || true)

          missing=""
          [ -z "$changelog_changed" ] && missing="CHANGELOG.md"
          if [ "$REQUIRE_VERSION" = 'true' ] && [ -z "$version_changed" ]; then
            [ -n "$missing" ] && missing="$missing and VERSION" || missing="VERSION"
          fi

          if [ -z "$missing" ]; then
            echo "✓ Source change is accompanied by the required changelog/version update."
            exit 0
          fi

          summary="Source under frontend/server/db changed, but ${missing} was not updated. Add a CHANGELOG.md line referencing the issue (and bump VERSION per docs/agents/delivery-workflow.md), or opt out with the 'no-changelog' label or '[skip changelog]' in the PR body."
          echo "::warning::${summary}"
          {
            echo "### ⚠️ Changelog gate"
            echo ""
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$WARN_ONLY" = 'true' ]; then
            echo "→ WARN_ONLY mode — reporting only, not failing the PR."
            exit 0
          fi
          exit 1
