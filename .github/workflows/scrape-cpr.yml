name: Scrape CPR Data (Manual)

on:
  repository_dispatch:
    types: [trigger-cpr-scrape]
  workflow_dispatch:
    inputs:
      member_filter:
        description: 'Specific member to scrape (optional, leave blank for all)'
        required: false
        default: ''

jobs:
  scrape-cpr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull latest changes
      run: |
        git config pull.rebase true
        git pull origin main

    - name: Set up scraper environment
      uses: ./.github/actions/scraper-setup

    - name: Run CPR scraper (writes tiers + CPR v2 directly to Supabase)
      env:
        SKIP_GOOGLE_SHEETS: 'true'
        MEMBER_FILTER: ${{ github.event.inputs.member_filter }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        APP_KEY_SECRET: ${{ secrets.APP_KEY_SECRET }}
        CPR_KEY_SECRET: ${{ secrets.CPR_KEY_SECRET }}
      run: python scripts/cpr_scraper.py

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cpr-scrape-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30
