name: Scrape CPR Data (Manual)

on:
  repository_dispatch:
    types: [trigger-cpr-scrape]
  workflow_dispatch:
    inputs:
      member_filter:
        description: 'Specific member to scrape (optional, leave blank for all)'
        required: false
        default: ''

jobs:
  scrape-cpr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull latest changes
      run: |
        git config pull.rebase true
        git pull origin main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify API keys configuration
      env:
        MEMBER_API_KEYS: ${{ secrets.MEMBER_API_KEYS }}
      run: |
        python -c "
        import os, json
        keys = json.loads(os.environ.get('MEMBER_API_KEYS', '{}'))
        print(f'✓ API keys configured for {len(keys)} members')
        if keys:
          print('Members:', ', '.join(keys.keys()))
        else:
          print('⚠ Warning: No member API keys found!')
        "

    - name: Run CPR scraper
      env:
        SKIP_GOOGLE_SHEETS: 'true'
        MEMBER_API_KEYS: ${{ secrets.MEMBER_API_KEYS }}
        MEMBER_FILTER: ${{ github.event.inputs.member_filter }}
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        CPR_KEY_SECRET: ${{ secrets.CPR_KEY_SECRET }}
      run: python scripts/cpr_scraper.py

    - name: Sync CPR data to Supabase
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
      run: python scripts/sync_to_supabase.py cpr

    - name: Sync CPR v2 data to Supabase
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
      run: python scripts/sync_to_supabase.py cpr_v2

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpr-scrape-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        mkdir -p public/data
        cp data/*.json public/data/ 2>/dev/null || true
        git add data/*.json public/data/*.json
        if ! git diff --staged --quiet; then
          git commit -m "Update CPR data [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi
