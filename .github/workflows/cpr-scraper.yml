# .github/workflows/cpr-scraper.yml
name: CPR Data Scraper

on:
  # Triggered by repository dispatch from Google Sheets button
  repository_dispatch:
    types: [trigger-cpr-scrape]
  # Allow manual triggers from GitHub UI for testing
  workflow_dispatch:
    inputs:
      member_filter:
        description: 'Specific member to scrape (optional, leave blank for all)'
        required: false
        default: ''

jobs:
  scrape-cpr-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    # Add permissions for git push
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create Google credentials file
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_DRIVE_CREDENTIALS" > google_credentials.json
        
    - name: Update Sheets status to Processing
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        python -c "
        from scripts.utils.google_sheets import GoogleSheetsManager
        sheets = GoogleSheetsManager()
        sheets.update_status('Processing CPR scrape...')
        "
        
    - name: Run CPR scraper
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        MEMBER_FILTER: ${{ github.event.inputs.member_filter }}
      run: |
        python scripts/cpr_scraper.py
        
    - name: Update Sheets status to Complete
      if: success()
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        python -c "
        from scripts.utils.google_sheets import GoogleSheetsManager
        from datetime import datetime
        sheets = GoogleSheetsManager()
        sheets.update_status(f'CPR scrape completed at {datetime.now().strftime(\"%Y-%m-%d %H:%M:%S\")}')
        "
        
    - name: Update Sheets status to Failed
      if: failure()
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        python -c "
        from scripts.utils.google_sheets import GoogleSheetsManager
        sheets = GoogleSheetsManager()
        sheets.update_status('CPR scrape failed - check GitHub Actions logs')
        "
        
    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: cpr-scrape-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30