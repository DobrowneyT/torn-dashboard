# ============================================
# FILE: .github/workflows/cpr-scraper.yml
# ============================================
name: CPR Data Scraper

on:
  repository_dispatch:
    types: [trigger-cpr-scrape]
  workflow_dispatch:
    inputs:
      member_filter:
        description: 'Specific member to scrape (optional, leave blank for all)'
        required: false
        default: ''

jobs:
  scrape-cpr-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull latest changes
      run: |
        git config pull.rebase true
        git pull origin main
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create Google credentials file
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_DRIVE_CREDENTIALS" > google_credentials.json
    
    - name: Verify API keys configuration
      env:
        MEMBER_API_KEYS: ${{ secrets.MEMBER_API_KEYS }}
      run: |
        python -c "
        import os
        import json
        keys_json = os.environ.get('MEMBER_API_KEYS', '{}')
        keys = json.loads(keys_json)
        print(f'✓ API keys configured for {len(keys)} members')
        if keys:
          print('Members:', ', '.join(keys.keys()))
        else:
          print('⚠ Warning: No member API keys found!')
        "
        
    - name: Update Sheets status to Processing
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        python -c "
        from scripts.utils.google_sheets import GoogleSheetsManager
        sheets = GoogleSheetsManager()
        sheets.update_status('Processing CPR scrape...')
        print('✓ Status updated to Processing')
        "
        
    - name: Run CPR scraper
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        MEMBER_API_KEYS: ${{ secrets.MEMBER_API_KEYS }}
        MEMBER_FILTER: ${{ github.event.inputs.member_filter }}
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}   
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}     
        GIST_ID: ${{ secrets.GIST_ID }}
      run: |
        python scripts/cpr_scraper.py
    
    - name: Sync CPR data to Supabase
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        echo "Syncing CPR data to Supabase database..."
        python scripts/sync_to_supabase.py cpr
        
    - name: Update Sheets status to Complete
      if: success()
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        python -c "
        from scripts.utils.google_sheets import GoogleSheetsManager
        from datetime import datetime
        sheets = GoogleSheetsManager()
        timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
        sheets.update_status(f'✓ CPR scrape completed at {timestamp}')
        print('✓ Status updated to Complete')
        "
        
    - name: Update Sheets status to Failed
      if: failure()
      env:
        GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      run: |
        python -c "
        from scripts.utils.google_sheets import GoogleSheetsManager
        sheets = GoogleSheetsManager()
        sheets.update_status('✗ CPR scrape failed - check GitHub Actions logs')
        print('✗ Status updated to Failed')
        "
        
    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpr-scrape-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

    - name: Sync data to public folder
      run: |
        mkdir -p public/data
        cp data/*.json public/data/ 2>/dev/null || true
        
    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add data/*.json public/data/*.json
        if ! git diff --staged --quiet; then
          git commit -m "Update CPR data [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi