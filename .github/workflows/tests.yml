name: Tests

on:
  pull_request:
    branches: [dev, main]

# ⚠️ One run per PR, and a new push cancels the old one.
#
# This runs on a SINGLE self-hosted runner, so a superseded run is not merely
# wasted — it sits in the queue ahead of the run you actually care about. A
# force-push during review used to leave the previous run burning a slot for its
# full ~7 minutes, which is most of a PR's wall-clock time.
#
# `github.ref` is `refs/pull/<n>/merge` here, so each PR gets its own group and
# concurrent PRs never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node Tests (Vitest — frontend, server, db)
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Vitest across workspaces
      # The db workspace runs against an embedded Postgres — no service container needed.
      run: npm run test:run

  compose-check:
    name: Compose build + boot check
    runs-on: self-hosted
    timeout-minutes: 20
    # ⚠️ This runner is the same box as production (self-hosted on the
    # deploy VPS) — unlike a GitHub-hosted runner's disposable VM, every
    # docker command here shares the SAME Docker daemon production runs on.
    # deploy/docker-compose.yml pins `name: tnl-dashboard`, which is
    # production's own compose project (update.sh uses the identical file,
    # unmodified) — without this override, this job's `down -v` at the end
    # would tear down and DELETE THE VOLUMES of the live production stack,
    # not a CI sandbox. tnl-dashboard-dev (staging) already reserves its own
    # name the same way; this job gets a third, disposable one.
    env:
      # ⚠️ **Per-RUN, not a constant.** It used to be the fixed string
      # `tnl-dashboard-ci`, which is safe only while exactly one of these
      # jobs can ever run at a time. Two concurrent runs would share the
      # project, fight over the same containers, and each finish with
      # `down -v` — tearing down the other's stack, on the box that also
      # runs production. Deriving it from the run id makes this job safe to
      # parallelise, which is the prerequisite for adding a second runner.
      COMPOSE_PROJECT_NAME: tnl-dashboard-ci-${{ github.run_id }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Configure compose environment
      run: |
        set -euo pipefail
        # Isolated from BOTH the runner's own defaults AND production's real
        # ports (production listens on 5432/8088 on this same host) — a
        # plain "avoid the runner's defaults" comment stopped being enough
        # the moment this started running on the production box itself.
        #
        # ⚠️ Port 0 means "kernel, pick a free one AT BIND TIME", and that
        # timing is the whole point. This used to shuf a port and check it with
        # `ss` — which is a time-of-check/time-of-use race: the check passes,
        # then minutes of image building go by before compose actually binds,
        # and a concurrent run can take the port in between. PR #746 failed
        # exactly that way ("failed to bind host port 0.0.0.0:36580/tcp:
        # address already in use") during a run of back-to-back merges, and the
        # error looks nothing like its cause. The old code could also hand the
        # SAME port to both services, since neither was bound when either was
        # checked. There is no window left to lose now: nothing is reserved,
        # and `docker compose port` reports what was actually assigned.
        cp deploy/.env.example deploy/.env
        echo "POSTGRES_HOST_PORT=0" >> deploy/.env
        echo "HTTP_PORT=0" >> deploy/.env
        echo "project $COMPOSE_PROJECT_NAME  ports: kernel-assigned"

    - name: Build images
      run: docker compose -f deploy/docker-compose.yml --project-directory deploy build

    - name: Boot the shared services
      run: docker compose -f deploy/docker-compose.yml --project-directory deploy up -d --wait postgres nginx

    # ⚠️ AFTER the bind, never before — that ordering is the fix. `port` reports
    # what the kernel actually handed out, so there is no reservation to lose
    # and no window in which another run can take it.
    - name: Record the ports the kernel assigned
      run: |
        set -euo pipefail
        compose() { docker compose -f deploy/docker-compose.yml --project-directory deploy "$@"; }
        WEB_PORT=$(compose port nginx 80 | head -1 | sed 's/.*://')
        PG_PORT=$(compose port postgres 5432 | head -1 | sed 's/.*://')
        test -n "$WEB_PORT" && test -n "$PG_PORT"
        echo "CI_HTTP_PORT=$WEB_PORT" >> "$GITHUB_ENV"
        # ⚠️ PGPORT in the ENVIRONMENT, not back into deploy/.env. new-faction.mjs
        # runs on the host and reads POSTGRES_HOST_PORT from that file, but it
        # uses `??=`, so an exported PGPORT wins. Rewriting the file instead
        # would change postgres's published-port config mid-run, and the next
        # `compose up` would want to recreate the container we just provisioned
        # into.
        echo "PGPORT=$PG_PORT" >> "$GITHUB_ENV"
        echo "nginx on $WEB_PORT  postgres on $PG_PORT"

    # Every faction (forge included) is a module: this IS the production
    # runbook, exercised end-to-end on every PR.
    - name: Provision the forge faction via the runbook
      run: |
        npm ci --workspaces --include-workspace-root
        node db/new-faction.mjs --slug forge --name "CI Forge" --faction-id 53100

    - name: Bring up the faction module
      run: >
        docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml
        --project-directory deploy up -d --build --wait api-forge nginx

    - name: Probe API health through nginx
      run: |
        curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://localhost:${CI_HTTP_PORT}/api/health | tee /tmp/health.json
        grep -q '"status":"ok"' /tmp/health.json
        grep -q '"faction":"forge"' /tmp/health.json
        # Host-header routing answers for the faction's own hostname too.
        curl -fsS -H 'Host: forge.localhost' http://localhost:${CI_HTTP_PORT}/api/health | grep -q '"faction":"forge"'

    - name: Probe SPA through nginx
      run: |
        curl -fsS http://localhost:${CI_HTTP_PORT}/ | grep -qi '<div id="root"'

    # Cache policy (#382). Silent to a human — a wrong header here just means
    # users quietly run an old bundle for hours after a deploy and report bugs
    # against code we already fixed.
    - name: Probe SPA cache headers
      run: |
        set -euo pipefail
        # The entry document must never be stored, on the bare path AND on a
        # client-side route (which reaches index.html by internal redirect).
        for path in / /index.html /war-room; do
          curl -fsSI "http://localhost:${CI_HTTP_PORT}$path" | grep -qi 'cache-control: no-store' \
            || { echo "::error::$path is missing no-store"; exit 1; }
        done
        # The service worker outlives even a hard refresh if it goes stale.
        curl -fsSI http://localhost:${CI_HTTP_PORT}/sw.js | grep -qi 'cache-control: no-store' \
          || { echo "::error::/sw.js is missing no-store"; exit 1; }
        # Content-hashed assets are safe to cache forever, and should be.
        asset=$(curl -fsS http://localhost:${CI_HTTP_PORT}/ | grep -o '/assets/[^"]*\.js' | head -1)
        test -n "$asset" || { echo "::error::no hashed asset found in index.html"; exit 1; }
        curl -fsSI "http://localhost:${CI_HTTP_PORT}$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable' \
          || { echo "::error::$asset is not immutably cached"; exit 1; }

    # Readiness reports live DB connectivity per faction (slice #76).
    - name: Probe readiness through nginx
      run: |
        curl -fsS -H 'Host: forge.localhost' http://localhost:${CI_HTTP_PORT}/api/health/ready | tee /tmp/ready.json
        grep -q '"status":"ok"' /tmp/ready.json
        grep -q '"db":"up"' /tmp/ready.json

    # The nightly backup job and the restore drill, end-to-end through the
    # sidecar image against the real postgres:17 (slice #76).
    - name: Backup + restore drill
      run: |
        cd deploy
        docker compose -f docker-compose.yml -f docker-compose.override.yml --project-directory . \
          run --build --rm backup node db/backup.mjs --out /backups
        # --role app_forge: the scratch name would derive a non-existent
        # app_forge_restore. restore.mjs re-applies the grants and FAILS if the
        # app role still can't read — a dump carries no privileges, so without
        # this a "successful" restore is a DB the API cannot boot against (#115).
        docker compose -f docker-compose.yml -f docker-compose.override.yml --project-directory . \
          run --rm backup sh -c \
          'node db/restore.mjs --create --db faction_forge_restore --role app_forge --archive $(ls -1t /backups/faction_forge_*.sql.gz | head -1)' \
          | tee /tmp/restore.log
        grep -q 'app_forge can read: true' /tmp/restore.log

    # Off-site leg (#117): the same job against an rclone remote (a local dir
    # standing in for B2 — identical rclone semantics, no credentials in CI).
    # Proves upload, the SCOPED retention sweep (foreign files survive), and
    # that an archive pulled back FROM the remote restores bootable.
    - name: Off-site backup drill (rclone remote)
      run: |
        cd deploy
        mkdir -p /tmp/fake-b2
        echo "someone else's data" > /tmp/fake-b2/keep-me.txt
        echo "old dump" | gzip > /tmp/fake-b2/faction_forge_20200101T000000Z.sql.gz
        touch -d '20 days ago' /tmp/fake-b2/keep-me.txt /tmp/fake-b2/faction_forge_20200101T000000Z.sql.gz

        docker compose -f docker-compose.yml -f docker-compose.override.yml --project-directory . \
          run --rm -e RCLONE_REMOTE=/b2 -v /tmp/fake-b2:/b2 backup \
          node db/backup.mjs --out /backups --db faction_forge

        ls -1 /tmp/fake-b2 | tee /tmp/b2.txt
        grep -qE 'faction_forge_2[0-9]{7}T[0-9]{6}Z\.sql\.gz' /tmp/b2.txt   # upload landed
        grep -q  'keep-me.txt' /tmp/b2.txt                                  # foreign file survived the prune
        ! grep -q 'faction_forge_20200101T000000Z' /tmp/b2.txt              # expired archive swept

        docker compose -f docker-compose.yml -f docker-compose.override.yml --project-directory . \
          run --rm -e RCLONE_REMOTE=/b2 -v /tmp/fake-b2:/b2 backup sh -c '
            NAME=$(rclone lsf /b2 --include "faction_forge_*.sql.gz" | sort | tail -1)
            rclone copy "/b2/$NAME" /tmp/from-b2/
            node db/restore.mjs --create --db faction_forge_b2drill --role app_forge --archive "/tmp/from-b2/$NAME"
          ' | tee /tmp/b2restore.log
        grep -q 'app_forge can read: true' /tmp/b2restore.log

    - name: Show logs on failure
      if: failure()
      run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml --project-directory deploy logs

    # ⚠️ `--rmi local` is new, and it is the other half of the per-run project
    # name above. A constant project name meant each run OVERWROTE the previous
    # run's images; a per-run name means every run leaves its own
    # `tnl-dashboard-ci-<id>-api-forge` behind forever. Those are TAGGED, so a
    # dangling-image prune never touches them — the isolation fix would have
    # quietly become a disk leak of several GB a day.
    #
    # `local` removes only images compose built itself, never a pulled one like
    # `postgres:16` that a custom `image:` field names. The build CACHE survives,
    # so the next run rebuilds just as fast.
    - name: Tear down
      if: always()
      run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml --project-directory deploy down -v --rmi local
