name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Vitest
      # Fake Supabase env vars are required so supabase.js doesn't throw at import time.
      # These are never used for real calls during unit tests.
      env:
        VITE_SUPABASE_URL: https://placeholder.supabase.co
        VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        VITE_SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      run: npm run test:run

  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run self-contained pytest tests
      # Only run tests that are self-contained and don't require external APIs/credentials.
      # Pre-existing tests in tests/ may require Google Sheets, live API keys, etc.
      env:
        TESTING_MODE: 'true'
      run: pytest tests/test_war_data_update.py tests/test_war_sync.py tests/test_key_pool.py -v
