name: Backfill Faction Attacks (Parallel)

# 2.0: parallel backfill. The timeline is split into `shard_count` contiguous
# windows; each shard runs on its own runner, claims a DISTINCT key from the
# consented rotation pool, and upserts its window straight to Supabase. Upsert
# is idempotent on attack_id, so disjoint shards need no merge/commit step.
#
# For the routine daily incremental fetch, see daily-scrapers.yml — this
# workflow is for fast on-demand (re)backfills.

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: 'Number of parallel shards (each uses a distinct pooled key)'
        default: '6'
      backfill_from_ts:
        description: 'Unix timestamp to backfill from (0 = all history)'
        default: '0'
  repository_dispatch:
    types: [trigger-faction-attacks-scrape]

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      shard_count: ${{ steps.gen.outputs.shard_count }}
    steps:
      - id: gen
        run: |
          COUNT="${{ github.event.inputs.shard_count || '6' }}"
          SHARDS=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$COUNT")
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shard_count=$COUNT" >> "$GITHUB_OUTPUT"

  backfill:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare-matrix.outputs.shards) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up scraper environment
      uses: ./.github/actions/scraper-setup

    - name: Backfill attacks shard ${{ matrix.shard }}
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        APP_KEY_SECRET: ${{ secrets.APP_KEY_SECRET }}
        CPR_KEY_SECRET: ${{ secrets.CPR_KEY_SECRET }}
        VITE_FACTION_ID: '10739'
        ATTACKS_SHARD_COUNT: ${{ needs.prepare-matrix.outputs.shard_count }}
        ATTACKS_SHARD_INDEX: ${{ matrix.shard }}
        ATTACKS_BACKFILL_FROM_TS: ${{ github.event.inputs.backfill_from_ts || '0' }}
      run: python scripts/faction_attacks_update.py

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: faction-attacks-backfill-logs-${{ github.run_number }}-shard-${{ matrix.shard }}
        path: logs/
        retention-days: 14
        if-no-files-found: ignore
