name: Daily Scrapers

on:
  schedule:
    # Run daily at 01:00 UTC (Torn City Time is UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

# Flow:
#   1. prepare      — checkout repo, upload current data/ as artifact
#   2. scrape-*     — six jobs run in parallel; each downloads initial-data,
#                     runs its scraper + Supabase sync, then uploads output
#                     files as an artifact.  No git push happens here.
#                     (scrape-member-stats and sync-items write directly to
#                     Supabase and don't produce data artifacts.)
#   3. commit-data  — runs after all jobs finish; downloads every data
#                     artifact, merges into the workspace, and does one
#                     atomic commit + push.

jobs:

  # ── 0. Prepare ──────────────────────────────────────────────────────────────
  prepare:
    name: Prepare — snapshot current data
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Upload current data as baseline artifact
      uses: actions/upload-artifact@v4
      with:
        name: initial-data
        path: data/
        retention-days: 1


  # ── 1a. Scrape Crimes ────────────────────────────────────────────────────────
  scrape-crimes:
    name: Scrape Crimes Data
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download baseline data
      uses: actions/download-artifact@v4
      with:
        name: initial-data
        path: data/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run daily crime update
      env:
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        SKIP_GOOGLE_SHEETS: 'true'
        SKIP_GIT_PUSH: 'true'
      run: python scripts/daily_crime_update.py

    - name: Sync crimes data to Supabase
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
      run: python scripts/sync_to_supabase.py crimes

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crime-scrape-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

    - name: Upload crimes output
      uses: actions/upload-artifact@v4
      with:
        name: data-crimes
        path: data/crimes_database.json
        retention-days: 1


  # ── 1b. Scrape CPR ───────────────────────────────────────────────────────────
  scrape-cpr:
    name: Scrape CPR Data
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download baseline data
      uses: actions/download-artifact@v4
      with:
        name: initial-data
        path: data/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify API keys configuration
      env:
        MEMBER_API_KEYS: ${{ secrets.MEMBER_API_KEYS }}
      run: |
        python -c "
        import os, json
        keys = json.loads(os.environ.get('MEMBER_API_KEYS', '{}'))
        print(f'✓ API keys configured for {len(keys)} members')
        if keys:
          print('Members:', ', '.join(keys.keys()))
        else:
          print('⚠ Warning: No member API keys found!')
        "

    - name: Run CPR scraper (writes tiers + CPR v2 directly to Supabase)
      env:
        SKIP_GOOGLE_SHEETS: 'true'
        MEMBER_API_KEYS: ${{ secrets.MEMBER_API_KEYS }}
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        CPR_KEY_SECRET: ${{ secrets.CPR_KEY_SECRET }}
        SKIP_GIT_PUSH: 'true'
      run: python scripts/cpr_scraper.py

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cpr-scrape-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30


  # ── 1c. Scrape Wars ──────────────────────────────────────────────────────────
  scrape-wars:
    name: Scrape War Data
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download baseline data
      uses: actions/download-artifact@v4
      with:
        name: initial-data
        path: data/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run war data update
      env:
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        VITE_FACTION_ID: '10739'
        SKIP_GIT_PUSH: 'true'
      run: python scripts/war_data_update.py

    - name: Sync war data to Supabase
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
      run: python scripts/sync_to_supabase.py wars

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: war-scrape-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

    - name: Upload war output
      uses: actions/upload-artifact@v4
      with:
        name: data-wars
        path: data/war_database.json
        retention-days: 1
        if-no-files-found: warn


  # ── 1d. Scrape Faction Attacks ───────────────────────────────────────────────
  scrape-faction-attacks:
    name: Scrape Faction Attacks
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download baseline data
      uses: actions/download-artifact@v4
      with:
        name: initial-data
        path: data/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch faction attacks
      env:
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        VITE_FACTION_ID: '10739'
        SKIP_GIT_PUSH: 'true'
      run: python scripts/faction_attacks_update.py

    - name: Sync faction attacks to Supabase
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
      run: python scripts/sync_to_supabase.py attacks

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: faction-attacks-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

    - name: Upload faction attacks output
      uses: actions/upload-artifact@v4
      with:
        name: data-attacks
        path: data/faction_attacks_database_*.json
        retention-days: 1
        if-no-files-found: warn

  # ── 1e. Scrape Member Daily Stats ─────────────────────────────────────────────
  scrape-member-stats:
    name: Scrape Member Daily Stats
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Scrape member stats and gym contributions
      env:
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
      run: python scripts/scrape_member_stats.py

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: member-stats-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30


  # ── 1f. Sync Items Catalog ───────────────────────────────────────────────────
  sync-items:
    name: Sync Items Catalog
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Sync items catalog to Supabase
      env:
        TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
      run: python scripts/items_update.py

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: items-sync-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30
        if-no-files-found: ignore


  # ── 2. Commit all data in one push ───────────────────────────────────────────
  commit-data:
    name: Commit & Push Data
    needs: [scrape-crimes, scrape-cpr, scrape-wars, scrape-faction-attacks, scrape-member-stats, sync-items]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Run even if some scrapers failed so we still commit whatever succeeded
    if: always() && needs.prepare.result == 'success'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull latest changes
      run: |
        git config pull.rebase true
        git pull origin main

    - name: Download crimes output
      if: needs.scrape-crimes.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: data-crimes
        path: data/
      continue-on-error: true

    - name: Download war output
      if: needs.scrape-wars.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: data-wars
        path: data/
      continue-on-error: true

    - name: Download faction attacks output
      if: needs.scrape-faction-attacks.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: data-attacks
        path: data/
      continue-on-error: true

    - name: Copy to public/data and commit
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        mkdir -p public/data
        # Copy all JSON files except backups (chunk files are included via the glob)
        find data -maxdepth 1 -name "*.json" -exec cp {} public/data/ \; 2>/dev/null || true
        git add data/*.json public/data/*.json
        if ! git diff --staged --quiet; then
          git commit -m "Update scraped data [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi
