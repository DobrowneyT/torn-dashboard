name: Scrape Crimes Data (Manual)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-crime-scrape]

jobs:
  scrape-crimes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull latest changes
      run: |
        git config pull.rebase true
        git pull origin main

    - name: Set up scraper environment
      uses: ./.github/actions/scraper-setup

    - name: Run daily crime update
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        APP_KEY_SECRET: ${{ secrets.APP_KEY_SECRET }}
        CPR_KEY_SECRET: ${{ secrets.CPR_KEY_SECRET }}
        SKIP_GOOGLE_SHEETS: 'true'
      run: python scripts/daily_crime_update.py

    - name: Sync crimes data to Supabase
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
      run: python scripts/sync_to_supabase.py crimes

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: crime-scrape-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        mkdir -p public/data
        cp data/*.json public/data/ 2>/dev/null || true
        git add data/*.json public/data/*.json
        if ! git diff --staged --quiet; then
          git commit -m "Update crimes data [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi
