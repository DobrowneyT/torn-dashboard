name: 'Scraper setup'
description: 'Set up Python 3.11 with a cached pip install of requirements.txt for the Torn scrapers.'

# Composite action shared by daily-scrapers.yml and the manual scrape-*.yml
# workflows so the Python/pip boilerplate lives in one place. The caller is
# responsible for actions/checkout before invoking this. Key acquisition is
# NOT done here — scrapers claim keys from the consented pool at runtime via
# scripts/utils/key_pool.py (needs the Supabase env on the run step).

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
