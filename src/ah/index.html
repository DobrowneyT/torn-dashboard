<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction House Listings - Torn Forge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            color: #4CAF50;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #aaa;
            font-size: 1.1em;
        }
        
        .filters {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }
        
        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            color: #4CAF50;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        
        input, select {
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 1em;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        .btn {
            padding: 12px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }
        
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: rgba(76, 175, 80, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .stat-label {
            color: #aaa;
            margin-top: 5px;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        
        .sort-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: rgba(76, 175, 80, 0.2);
        }
        
        th {
            padding: 15px;
            text-align: left;
            color: #4CAF50;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }
        
        th:hover {
            background: rgba(76, 175, 80, 0.3);
        }
        
        th::after {
            content: ' ↕';
            opacity: 0.3;
        }
        
        th.sort-asc::after {
            content: ' ↑';
            opacity: 1;
        }
        
        th.sort-desc::after {
            content: ' ↓';
            opacity: 1;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #333;
        }
        
        tbody tr {
            transition: background 0.2s;
        }
        
        tbody tr:hover {
            background: rgba(76, 175, 80, 0.1);
        }
        
        .rarity-yellow {
            color: #FFD700;
        }
        
        .rarity-orange {
            color: #FF8C00;
        }
        
        .rarity-red {
            color: #FF4444;
        }
        
        .price {
            color: #4CAF50;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #4CAF50;
            font-size: 1.2em;
        }
        
        .error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #FF4444;
            padding: 20px;
            border-radius: 10px;
            color: #FF4444;
            text-align: center;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .page-btn {
            padding: 8px 16px;
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .page-btn:hover {
            background: #4CAF50;
            color: white;
        }
        
        .page-btn.active {
            background: #4CAF50;
            color: white;
        }
        
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        @media (max-width: 768px) {
            .filter-row {
                grid-template-columns: 1fr;
            }
            
            table {
                font-size: 0.9em;
            }
            
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏛️ Auction House Listings</h1>
            <p class="subtitle">Browse historical auction data from Torn City</p>
        </header>
        
        <div class="filters">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="itemType">Item Type</label>
                    <select id="itemType">
                        <option value="">All Types</option>
                        <option value="Primary">Primary</option>
                        <option value="Secondary">Secondary</option>
                        <option value="Melee">Melee</option>
                        <option value="Defensive">Defensive</option>
                        <option value="Armour">Armour</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="itemSearch">Item Name/ID</label>
                    <input type="text" id="itemSearch" placeholder="Search by name or ID...">
                </div>
                
                <div class="filter-group">
                    <label for="minPrice">Min Price</label>
                    <input type="number" id="minPrice" placeholder="0">
                </div>
                
                <div class="filter-group">
                    <label for="maxPrice">Max Price</label>
                    <input type="number" id="maxPrice" placeholder="No limit">
                </div>
            </div>
            
            <div class="filter-row">
                <div class="filter-group">
                    <label for="rarity">Rarity</label>
                    <select id="rarity">
                        <option value="">All Rarities</option>
                        <option value="yellow">Yellow</option>
                        <option value="orange">Orange</option>
                        <option value="red">Red</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="dateFrom">Date From</label>
                    <input type="date" id="dateFrom">
                </div>
                
                <div class="filter-group">
                    <label for="dateTo">Date To</label>
                    <input type="date" id="dateTo">
                </div>
                
                <div class="filter-group" style="justify-content: flex-end;">
                    <label>&nbsp;</label>
                    <button class="btn" onclick="fetchData()">Apply Filters</button>
                </div>
            </div>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalListings">-</div>
                <div class="stat-label">Total Listings</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgPrice">-</div>
                <div class="stat-label">Avg Price</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="minPriceStat">-</div>
                <div class="stat-label">Min Price</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="maxPriceStat">-</div>
                <div class="stat-label">Max Price</div>
            </div>
        </div>
        
        <div class="results-header">
            <div>
                <strong id="resultsCount">0 results</strong>
            </div>
            <div class="sort-controls">
                <label>Items per page:</label>
                <select id="perPage" onchange="changePerPage()">
                    <option value="25">25</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="250">250</option>
                </select>
            </div>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('timestamp')">Date</th>
                        <th onclick="sortTable('item_name')">Item</th>
                        <th onclick="sortTable('item_type')">Type</th>
                        <th onclick="sortTable('price')">Price</th>
                        <th onclick="sortTable('bids')">Bids</th>
                        <th onclick="sortTable('seller_name')">Seller</th>
                        <th onclick="sortTable('buyer_name')">Buyer</th>
                        <th>Quality</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr>
                        <td colspan="8" class="loading">
                            Click "Apply Filters" to load data
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="pagination" id="pagination"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE'; // e.g., https://xxxxx.supabase.co
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE'; // Your public anon key
        
        // ============================================
        // INITIALIZE SUPABASE CLIENT
        // ============================================
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // ============================================
        // STATE
        // ============================================
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        let perPage = 50;
        let sortColumn = 'timestamp';
        let sortDirection = 'desc';
        
        // ============================================
        // FETCH DATA FROM SUPABASE
        // ============================================
        async function fetchData() {
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '<tr><td colspan="8" class="loading">Loading data...</td></tr>';
            
            try {
                // Build query
                let query = supabase
                    .from('auction_listings')
                    .select('*');
                
                // Apply filters
                const itemType = document.getElementById('itemType').value;
                if (itemType) {
                    query = query.eq('item_type', itemType);
                }
                
                const itemSearch = document.getElementById('itemSearch').value.trim();
                if (itemSearch) {
                    if (!isNaN(itemSearch)) {
                        query = query.eq('item_id', parseInt(itemSearch));
                    } else {
                        query = query.ilike('item_name', `%${itemSearch}%`);
                    }
                }
                
                const minPrice = document.getElementById('minPrice').value;
                if (minPrice) {
                    query = query.gte('price', parseInt(minPrice));
                }
                
                const maxPrice = document.getElementById('maxPrice').value;
                if (maxPrice) {
                    query = query.lte('price', parseInt(maxPrice));
                }
                
                const rarity = document.getElementById('rarity').value;
                if (rarity) {
                    query = query.eq('item_rarity', rarity);
                }
                
                const dateFrom = document.getElementById('dateFrom').value;
                if (dateFrom) {
                    const timestamp = Math.floor(new Date(dateFrom).getTime() / 1000);
                    query = query.gte('timestamp', timestamp);
                }
                
                const dateTo = document.getElementById('dateTo').value;
                if (dateTo) {
                    const timestamp = Math.floor(new Date(dateTo).getTime() / 1000);
                    query = query.lte('timestamp', timestamp);
                }
                
                // Execute query (limit to 10000 for performance)
                const { data, error } = await query.limit(10000);
                
                if (error) throw error;
                
                allData = data || [];
                filteredData = [...allData];
                
                updateStats();
                sortTable(sortColumn);
                currentPage = 1;
                renderTable();
                renderPagination();
                
            } catch (error) {
                console.error('Error fetching data:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="error">
                            Error loading data: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }
        
        // ============================================
        // UPDATE STATISTICS
        // ============================================
        function updateStats() {
            const prices = filteredData.map(item => item.price).filter(p => p > 0);
            
            document.getElementById('totalListings').textContent = filteredData.length.toLocaleString();
            
            if (prices.length > 0) {
                const avgPrice = prices.reduce((a, b) => a + b, 0) / prices.length;
                document.getElementById('avgPrice').textContent = '$' + Math.round(avgPrice).toLocaleString();
                document.getElementById('minPriceStat').textContent = '$' + Math.min(...prices).toLocaleString();
                document.getElementById('maxPriceStat').textContent = '$' + Math.max(...prices).toLocaleString();
            } else {
                document.getElementById('avgPrice').textContent = '-';
                document.getElementById('minPriceStat').textContent = '-';
                document.getElementById('maxPriceStat').textContent = '-';
            }
        }
        
        // ============================================
        // SORT TABLE
        // ============================================
        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'desc';
            }
            
            filteredData.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];
                
                if (typeof valA === 'string') {
                    valA = valA.toLowerCase();
                    valB = valB.toLowerCase();
                }
                
                if (sortDirection === 'asc') {
                    return valA > valB ? 1 : -1;
                } else {
                    return valA < valB ? 1 : -1;
                }
            });
            
            // Update sort indicators
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });
            
            event.target.classList.add(`sort-${sortDirection}`);
            
            renderTable();
        }
        
        // ============================================
        // RENDER TABLE
        // ============================================
        function renderTable() {
            const tbody = document.getElementById('resultsBody');
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageData = filteredData.slice(start, end);
            
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">No results found</td></tr>';
                return;
            }
            
            tbody.innerHTML = pageData.map(item => {
                const date = new Date(item.timestamp * 1000).toLocaleDateString();
                const rarityClass = item.item_rarity ? `rarity-${item.item_rarity}` : '';
                
                // Parse item stats if available
                let quality = '-';
                if (item.item_stats) {
                    try {
                        const stats = typeof item.item_stats === 'string' 
                            ? JSON.parse(item.item_stats) 
                            : item.item_stats;
                        if (stats.quality) {
                            quality = stats.quality.toFixed(2);
                        }
                    } catch (e) {}
                }
                
                return `
                    <tr>
                        <td>${date}</td>
                        <td class="${rarityClass}">${item.item_name || 'Unknown'}</td>
                        <td>${item.item_type || '-'}</td>
                        <td class="price">$${item.price.toLocaleString()}</td>
                        <td>${item.bids || 0}</td>
                        <td>${item.seller_name || 'Unknown'}</td>
                        <td>${item.buyer_name || 'Unknown'}</td>
                        <td>${quality}</td>
                    </tr>
                `;
            }).join('');
            
            document.getElementById('resultsCount').textContent = 
                `${filteredData.length.toLocaleString()} results (page ${currentPage} of ${Math.ceil(filteredData.length / perPage)})`;
        }
        
        // ============================================
        // RENDER PAGINATION
        // ============================================
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredData.length / perPage);
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = '';
            
            // Previous button
            html += `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>`;
            
            // Page numbers
            for (let i = 1; i <= Math.min(totalPages, 10); i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }
            
            if (totalPages > 10) {
                html += `<button class="page-btn" disabled>...</button>`;
                html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }
            
            // Next button
            html += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>`;
            
            pagination.innerHTML = html;
        }
        
        // ============================================
        // CHANGE PAGE
        // ============================================
        function changePage(page) {
            const totalPages = Math.ceil(filteredData.length / perPage);
            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            renderTable();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // ============================================
        // CHANGE ITEMS PER PAGE
        // ============================================
        function changePerPage() {
            perPage = parseInt(document.getElementById('perPage').value);
            currentPage = 1;
            renderTable();
            renderPagination();
        }
    </script>
</body>
</html>
