# Staging instance (#292): one dev API + its own front door, serving ONE
# tenant's `faction_<slug>_dev` copy, reachable only through an SSH tunnel.
#
#   ./deploy/dev-deploy.sh <branch>     # the supported way to bring this up
#
# Runs from the DEV WORKTREE, never the production checkout. Its own compose
# project name (`tnl-dashboard-dev`) keeps every container, image and lock
# separate from production's `tnl-dashboard`, so neither stack's deploy can
# recreate or tear down the other's containers.
#
# Postgres is NOT defined here on purpose. The staging copy lives in the same
# cluster as the live tenants (that is what makes `pg_dump | psql` a local
# operation and keeps key material on the box), so this stack ATTACHES to the
# production stack's network and talks to the existing `postgres` service.
#
# Config comes from deploy/.env.dev, generated by dev-deploy.sh — see DEV.md.

name: tnl-dashboard-dev

services:
  api-dev:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file:
      - .env.dev
    environment:
      FACTION_SLUG: ${DEV_SLUG:?set DEV_SLUG — run deploy/dev-deploy.sh, do not bring this up by hand}
      PORT: 8080
      # Points at faction_<slug>_dev. Every write this instance makes lands in
      # the copy; the live tenant database is never opened.
      DATABASE_URL: ${DEV_DATABASE_URL:?set DEV_DATABASE_URL — run deploy/dev-deploy.sh}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # Real Torn: logging in and any scraper you deliberately enable make real
      # API calls with the copied key pool. Reads are free of consequence;
      # writes land only in the copy.
      TORN_API_BASE: ${TORN_API_BASE:-https://api.torn.com}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
      TORNSTATS_API_KEY: ${TORNSTATS_API_KEY:-}
      BSP_API_KEY: ${BSP_API_KEY:-}
      # ⚠ LIVE OUTBOUND — both default to OFF for staging (dev-deploy.sh leaves
      # them unset unless you opt in). Web Push reaches REAL members' browsers;
      # feedback opens REAL GitHub issues. See DEV.md "Blast radius".
      VAPID_PUBLIC_KEY: ${DEV_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${DEV_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${DEV_VAPID_SUBJECT:-}
      FEEDBACK_GITHUB_TOKEN: ${DEV_FEEDBACK_GITHUB_TOKEN:-}
      FEEDBACK_GITHUB_REPO: ${DEV_FEEDBACK_GITHUB_REPO:-}
      FEEDBACK_LABEL: ${FEEDBACK_LABEL:-}
      # ⚠ Chain Watch's bot endpoint (#782). Unset leaves the route
      # UNREGISTERED, which is the right default — a staging instance nobody
      # asked to expose exposes nothing. Set DEV_CHAIN_WATCH_TOKEN to test the
      # Discord bot against the copy instead of against a live tenant.
      #
      # ⚠ Use a value of its own (openssl rand -hex 32), NOT the live tenant's
      # token. They read the same faction's data, but a token that only opens
      # the copy cannot be turned on production.
      CHAIN_WATCH_TOKEN: ${DEV_CHAIN_WATCH_TOKEN:-}
      # ⚠ Push a redraw to the Discord bot when a sign-up changes, over a
      # bind-mounted unix socket. A container cannot reach the host's
      # 127.0.0.1, and binding 0.0.0.0 would put a control channel for a
      # process holding a Discord token on the public internet — a socket has
      # no port and needs no firewall rule.
      #
      # ⚠ Entirely optional. Unset, or the bot not listening, means the board
      # updates on its poll interval as before. Nothing here is load-bearing.
      CHAIN_NOTIFY_SOCKET: ${DEV_CHAIN_NOTIFY_SOCKET:-}
      PUBLIC_BASE_URL: http://localhost:${DEV_HTTP_PORT:-8090}
    volumes:
      # The directory, not the socket: the bot creates and deletes the file, and
      # a bind mount of a file that is replaced leaves the container holding the
      # old inode — a push that silently stops working after a bot restart.
      - ${DEV_CHAIN_NOTIFY_DIR:-/tmp/chain-notify-unused}:/run/chain-notify
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx-dev:
    build:
      context: ..
      dockerfile: deploy/nginx-dev.Dockerfile
    ports:
      # 127.0.0.1 ONLY. This is the single control that keeps staging off the
      # public internet: the port is not routable from outside the VPS, so the
      # only way in is `ssh -L`. Do not change the bind address.
      - "127.0.0.1:${DEV_HTTP_PORT:-8090}:80"
    restart: unless-stopped

networks:
  # The production stack's network, created by its compose project. External so
  # this file can never create (or delete) it — if it is missing, the prod stack
  # is down and staging has nothing to attach to.
  default:
    external: true
    name: tnl-dashboard_default
