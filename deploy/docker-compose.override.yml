# Per-faction API processes — managed by db/new-faction.mjs (slice #75).
# Auto-loaded by `docker compose up` alongside docker-compose.yml.
services:

  api-demo2:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      FACTION_SLUG: demo2
      PORT: 8080
      DATABASE_URL: postgres://app_demo2:${DB_PASSWORD_DEMO2}@postgres:5432/faction_demo2
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      TORN_API_BASE: ${TORN_API_BASE:-https://api.torn.com}
      SCRAPERS_ENABLED: ${SCRAPERS_ENABLED_DEMO2:-false}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
