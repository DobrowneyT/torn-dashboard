# Staging instance vhost (#292). One server block, one upstream: the dev
# instance serves exactly one tenant at a time (whichever faction_<slug>_dev
# the api-dev service is pointed at), so there is no host-based routing here.
#
# Deliberately does NOT include factions/*.conf — those name the production
# api-<slug> containers, which share this docker network. Routing to them from
# the staging front door would put live tenant data behind the dev URL.

# ⚠️ Uploads (bingo card art, proof and feedback screenshots) arrive as base64
# JSON. nginx's default limit is 1 MB, so anything bigger got a 413 from HERE,
# before the app's own limits were ever reached — a phone upload of a 2.6 MB
# card simply did nothing (2026-10-19). Set at the http level so it covers
# every tenant's generated vhost too. Matches the host vhost's 10m.
client_max_body_size 10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Make it obvious in the browser's network tab which instance answered.
    add_header X-TNL-Instance "staging" always;

    location /api/ {
        # Variable proxy_pass + docker resolver: re-resolve per request so a
        # dev API rebuild (which happens constantly here) doesn't leave nginx
        # proxying to a dead container IP until it restarts.
        resolver 127.0.0.11 valid=10s;
        set $upstream_dev api-dev:8080;
        proxy_pass http://$upstream_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Cache policy (#382), shared with the prod image. Especially load-bearing
    # here: staging redeploys every five minutes, so a cached index.html means
    # testing a build that no longer exists.
    include /etc/nginx/conf.d/snippets/spa-cache.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
