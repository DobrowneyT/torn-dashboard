# SPA cache policy (#382) — included inside every server block.
#
# There were NO cache headers anywhere before this. nginx served index.html
# with only ETag/Last-Modified, which lets a browser apply its own heuristic
# freshness (commonly ~10% of the document's age) and serve the entry document
# from cache WITHOUT revalidating. The user then keeps running an old bundle
# for hours after a deploy, and reports bugs against code we already fixed —
# which is exactly what happened during the war that produced #371 and #376.
#
# The split below is the standard one, and it is safe precisely because Vite
# content-hashes the bundles:
#
#   index.html   never cached      — it is the manifest that names the hashes
#   /assets/*    cached forever    — the hash IS the version; content at a
#                                    given URL can never change
#   sw.js        never cached      — not hashed, and a stale service worker
#                                    outlives even a hard refresh
#
# `always` matters: without it add_header is skipped on non-2xx responses, so
# a 304 would carry no policy at all.
#
# This file deliberately does NOT live at the conf.d root — nginx auto-includes
# /etc/nginx/conf.d/*.conf as top-level config, and these location blocks are
# only valid inside a server block.

# The entry document. Must be re-fetched every time so a deploy is picked up on
# the next navigation rather than whenever the browser feels like asking.
location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files $uri =404;
}

# The service worker. Browsers already revalidate this fairly aggressively, but
# a stale one is the worst case of all — it can keep serving old assets from
# its own cache across reloads — so it is spelled out rather than assumed.
location = /sw.js {
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files $uri =404;
}

# Content-hashed build output. A given URL's bytes never change, so this can be
# cached indefinitely; `immutable` also stops the browser revalidating on a
# plain refresh.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
