# Admin control plane vhost (#609). Read + provisioning only — the destructive
# surface listens on 127.0.0.1:8091 and is deliberately NOT proxied here.
#
# ⚠️ This file is always baked into the nginx image, whether or not the admin
# container is running. That is safe because of the variable proxy_pass below:
# nginx starts even when `admin` does not resolve, and simply 502s this vhost.
# A literal upstream would make nginx refuse to start for every tenant whenever
# the admin container was down — one optional service taking the fleet with it.
server {
    listen 80;
    server_name admin.monchoon.me;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream_admin admin:8090;
        proxy_pass http://$upstream_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
