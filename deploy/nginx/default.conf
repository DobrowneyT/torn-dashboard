# Host-routed multi-tenancy (slice #75): each faction gets a vhost in
# factions/*.conf (written by db/new-faction.mjs, baked in on nginx build).
# This default server keeps answering for any unmatched hostname — the
# original single-faction (forge) behavior.

# Only send Connection: upgrade when the client actually asked to upgrade —
# forcing it on plain HTTP requests breaks keep-alive through the proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

include /etc/nginx/conf.d/factions/*.conf;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-forge:8080;
        proxy_http_version 1.1;
        # WebSocket upgrade for the war room (slices #71-#72).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
