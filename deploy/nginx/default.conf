# Single-faction skeleton: everything routes to api-forge. Multi-faction
# host-header routing (one subdomain per faction) lands with slice #75.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api-forge:8080;
        proxy_http_version 1.1;
        # WebSocket upgrade for the war room (slices #71-#72).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
