# TNL dashboard self-hosted stack: shared Postgres + nginx only. Every
# faction (forge included) is a module — its api-<slug> service lives in
# docker-compose.override.yml, written by db/new-faction.mjs.
#
#   cp deploy/.env.example deploy/.env   # set POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.yml up --build

name: tnl-dashboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host access for db/new-faction.mjs and psql; not exposed beyond localhost.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx.Dockerfile
    ports:
      - "${HTTP_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  pgdata:
