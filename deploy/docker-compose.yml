# TNL dashboard self-hosted stack: shared Postgres + nginx only. Every
# faction (forge included) is a module — its api-<slug> service lives in
# docker-compose.override.yml, written by db/new-faction.mjs.
#
#   cp deploy/.env.example deploy/.env   # set POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.yml up --build

name: tnl-dashboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host access for db/new-faction.mjs and psql; not exposed beyond localhost.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx.Dockerfile
    ports:
      # HTTP_BIND=127.0.0.1 when a host reverse proxy fronts us (the Hetzner
      # deployment): the stack is then reachable only through that proxy, never
      # straight off the internet. Defaults to all interfaces for local dev.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8088}:80"
    restart: unless-stopped

  # Nightly per-faction backups (#76). Opt-in bring-up (like the scrapers):
  #   docker compose --profile backup up -d --build backup
  # Dumps every faction_* DB → gzip → /backups; uploads to RCLONE_REMOTE and
  # prunes past 14 days when object storage is wired (env below). One-shot and
  # the restore drill run through the same image — see deploy/README.md.
  backup:
    profiles: ["backup"]
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    # .env carries any RCLONE_* provider vars the operator adds for B2.
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-4}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  backups:
