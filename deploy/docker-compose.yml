# TNL dashboard self-hosted stack (slice #59 skeleton).
# One shared Postgres + nginx; one API process per faction (api-forge for now —
# db/new-faction.mjs prints the block to add for each additional faction).
#
#   cp deploy/.env.example deploy/.env   # set POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.yml up --build

name: tnl-dashboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host access for db/new-faction.mjs and psql; not exposed beyond localhost.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api-forge:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      FACTION_SLUG: forge
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/faction_forge
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx.Dockerfile
    ports:
      - "${HTTP_PORT:-8088}:80"
    depends_on:
      - api-forge
    restart: unless-stopped

volumes:
  pgdata:
