# TNL dashboard self-hosted stack: shared Postgres + nginx only. Every
# faction (forge included) is a module — its api-<slug> service lives in
# docker-compose.override.yml, written by db/new-faction.mjs.
#
#   cp deploy/.env.example deploy/.env   # set POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.yml up --build

name: tnl-dashboard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host access for db/new-faction.mjs and psql; not exposed beyond localhost.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx.Dockerfile
    ports:
      # HTTP_BIND=127.0.0.1 when a host reverse proxy fronts us (the Hetzner
      # deployment): the stack is then reachable only through that proxy, never
      # straight off the internet. Defaults to all interfaces for local dev.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8088}:80"
    restart: unless-stopped

  # Nightly per-faction backups (#76). Opt-in bring-up (like the scrapers):
  #   docker compose --profile backup up -d --build backup
  # Dumps every faction_* DB → gzip → /backups; uploads to RCLONE_REMOTE and
  # prunes past 14 days when object storage is wired (env below). One-shot and
  # the restore drill run through the same image — see deploy/README.md.
  backup:
    profiles: ["backup"]
    build:
      context: ..
      dockerfile: deploy/backup.Dockerfile
    # .env carries any RCLONE_* provider vars the operator adds for B2.
    env_file:
      - .env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-4}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Admin control plane (#609). Opt-in bring-up, like the backup sidecar:
  #
  #   docker compose --profile admin up -d --build admin
  #
  # ⚠️ Behind a profile deliberately. This is the one container that can affect
  # every tenant at once, so deploying it must be a separate act from deploying
  # tenants — `update.sh` runs a plain `up` and will not start or restart it.
  #
  # ⚠️ It REFUSES to start without ADMIN_USERNAME / ADMIN_PASSWORD_HASH /
  # ADMIN_TOTP_SECRET / ADMIN_SESSION_SECRET (see src/adminMain.ts). An admin
  # surface that comes up with no gate is worse than one that does not come up.
  # Generate them with: npx tsx db/admin-password.mts
  admin:
    profiles: ["admin"]
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    environment:
      # ⚠️ Every value defaults to EMPTY rather than using compose's required
      # `:?` syntax, and that is not laziness. Compose interpolates every
      # service when it parses the file — INCLUDING services behind a profile —
      # so one `:?` here would make every `docker compose` command fail for an
      # operator who has not configured the admin plane. That is `update.sh`,
      # and it would take the whole fleet's deploy down for the sake of an
      # optional container.
      #
      # Fail-closed lives in the application instead: src/adminMain.ts refuses
      # to start when any of these is missing, which is loud, immediate, and
      # contained to this one service.
      #
      # Writer role on the shared global DB — the ONLY writer in the fleet.
      DATABASE_URL: postgres://app_global_rw:${DB_PASSWORD_GLOBAL_RW:-}@postgres:5432/${GLOBAL_DB_NAME:-global}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      # Cross-checked against ADMIN_SESSION_SECRET at boot: sharing them would
      # make every tenant session token a valid fleet credential.
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PUBLIC_PORT: "8090"
      ADMIN_LOCAL_PORT: "8091"
      # ── Alerting (#609 slice 4) ──────────────────────────────────────────
      # All optional. Unset means the status page is the only place alerts
      # appear, which is a supported state — unlike the credentials above,
      # a missing value here degrades rather than opens anything.
      #
      # ⚠️ A literal `$` in ANY of these must be written `$$`. Compose
      # interpolates inside .env VALUES, and it does it silently: this is
      # exactly what truncated ADMIN_PASSWORD_HASH mid-string and crash-looped
      # the container on the live box. SMTP passwords are the likely victim
      # here. If a value contains a `$`, double it.
      ADMIN_DISCORD_WEBHOOK_URL: ${ADMIN_DISCORD_WEBHOOK_URL:-}
      ADMIN_SMTP_URL: ${ADMIN_SMTP_URL:-}
      ADMIN_DIGEST_TO: ${ADMIN_DIGEST_TO:-}
      ADMIN_DIGEST_FROM: ${ADMIN_DIGEST_FROM:-}
      ADMIN_DIGEST_HOUR_UTC: ${ADMIN_DIGEST_HOUR_UTC:-8}
      ADMIN_ALERT_INTERVAL_MS: ${ADMIN_ALERT_INTERVAL_MS:-60000}
      # Linked from the digest so the mail can stay short, and used to label
      # the webhook if this ever runs against more than one fleet.
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      ADMIN_HOST_LABEL: ${ADMIN_HOST_LABEL:-}
      # ⚠️ The ONLY Torn credential this box ever holds (#609 slice 7).
      # /v2/torn/items is public, which is exactly why the item catalogue is one
      # of only two jobs the #608 audit found movable off the tenants. Unset
      # means the fleet publishes no prices and every tenant syncs from its own
      # key pool, as it did before — a supported state, not a failure.
      ADMIN_TORN_API_KEY: ${ADMIN_TORN_API_KEY:-}
      # ⚠️ Fleet metrics (#632). The admin container holds the FLEET secret and
      # derives each tenant's token as HMAC-SHA256(secret, slug); every tenant
      # holds only its own derived value. One shared secret pasted into all of
      # them would mean a leak from ANY faction's env reads EVERY faction's
      # metrics — one faction's compromise should be one faction.
      FLEET_METRICS_SECRET: ${FLEET_METRICS_SECRET:-}
    volumes:
      # ⚠️ Read-only, and the only volume this container gets. Backup freshness
      # is the highest-value monitor there is — a job failing for three weeks is
      # worse than no backup, because you believe you have one — and mounting
      # the same volume also gives `statfs` the real host filesystem behind it,
      # so disk headroom comes free. `ro` because nothing here should ever be
      # able to delete a dump.
      - backups:/backups:ro
    ports:
      # ⚠️ THIS LINE is the security boundary for the local surface, not the
      # process's bind address. Docker forwards a published port to the
      # container's network interface, never to its loopback — binding the
      # listener to the container's 127.0.0.1 makes the published port reach
      # nothing at all (curl returns 000, not an HTTP status). So the listener
      # binds 0.0.0.0 inside, and `127.0.0.1:` here is what keeps it off the
      # internet. Reachable over an SSH tunnel:
      #   ssh -L 8091:127.0.0.1:8091 ubuntu@<vps>
      #
      # The public surface is deliberately NOT published — nginx proxies to it
      # over the compose network, so it is never exposed directly.
      - "127.0.0.1:8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/api/admin/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Mock Torn API for the #116 stress test. Opt-in only:
  #   docker compose --profile stress up -d mock-torn
  # Stress tenants point at it via TORN_API_BASE=http://mock-torn:3999 in
  # their override entries — real tenants never touch it. See LAUNCH.md §7.
  mock-torn:
    profiles: ["stress"]
    image: node:24-alpine
    working_dir: /app
    command: node deploy/stress/mock-torn.mjs
    volumes:
      - ../deploy/stress:/app/deploy/stress:ro
    environment:
      PORT: "3999"
      MEMBERS_PER_FACTION: ${STRESS_MEMBERS_PER_FACTION:-100}
      CHURN_FRACTION: ${STRESS_CHURN_FRACTION:-0.2}
      CHURN_PERIOD_SEC: ${STRESS_CHURN_PERIOD_SEC:-5}
    restart: unless-stopped

volumes:
  pgdata:
  backups:
