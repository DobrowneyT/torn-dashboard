# dev.monchoon.me — public front door for the STAGING instance (#292).
#
# Install to /etc/nginx/sites-available/dev.monchoon.me on the VPS, symlink into
# sites-enabled, then let Certbot add the TLS server block:
#
#   sudo ln -s /etc/nginx/sites-available/dev.monchoon.me /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d dev.monchoon.me
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is the HTTP-only form, matching files.monchoon.me.conf: the `listen
# 443` block, the certificate paths and the :80 → :443 redirect are all written
# in place by Certbot and are not tracked here.
#
# ── ⚠️ Read this before touching anything ────────────────────────────────────
#
# The staging database is a CLONE OF A LIVE TENANT. It includes member_secrets
# and faction_secrets, so it carries real, decryptable members' Torn API keys.
# That is deliberate — pool behaviour is the thing that cannot be tested any
# other way — and until now it was safe for one blunt reason: the instance was
# bound to 127.0.0.1 and the only way in was an SSH tunnel.
#
# This vhost is what replaces that tunnel, so it is now the ONLY thing standing
# between real members' keys and the open internet. Three controls do that job,
# and none of them is decorative:
#
#   1. The bind address is UNCHANGED. nginx-dev still publishes on
#      127.0.0.1:8090 (deploy/docker-compose.dev.yml) and nothing else on the
#      box may route to it. This vhost reaches it over loopback. If you ever
#      find yourself editing that bind to 0.0.0.0, stop: it would expose the
#      instance directly on :8090, bypassing everything below, in plaintext.
#      Note UFW is not active on this host — the bind IS the firewall.
#   2. TLS, via Certbot. Without it a session cookie and every API key rendered
#      in a settings page crosses the wire in clear text.
#   3. HTTP Basic auth, in front of the application's own login. Defence in
#      depth: staging runs unreleased code, which is exactly the code whose auth
#      has had the least exposure. A broken session check on a feature branch
#      should cost a bug report, not a key pool.
#
# ── Shared box ───────────────────────────────────────────────────────────────
#
# This VPS also serves someone else's sites. Nothing here touches a shared
# name — see the $tnl_connection_upgrade note in LAUNCH.md and the map below.
# Always `sudo nginx -t` before reloading.

# ⚠️ Deliberately NOT named $tnl_connection_upgrade. That map already exists in
# the tnl-dashboard vhost, and a duplicate map name is a FATAL nginx config
# error that takes down every site on the box, not just this one. A distinct
# name also keeps this file self-contained: reusing the other file's variable
# would mean removing the production vhost silently breaks staging with an
# "unknown variable" at reload time.
map $http_upgrade $dev_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.monchoon.me;

    # Uploads (feedback screenshots) match the production tenant vhost.
    client_max_body_size 10m;

    # Never index staging. It is a copy of a live faction's data behind a login,
    # and a search result for it is an invitation to go looking. `always` so the
    # header survives error responses too — including the 401 below, which is
    # the one an unauthenticated crawler actually sees.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Staging is never legitimately framed by anything.
    add_header X-Frame-Options "DENY" always;

    location / {
        # ── Gate 1: Basic auth ───────────────────────────────────────────────
        #
        # The realm string is what the browser shows in its prompt, so it says
        # which box you are being asked to log in to.
        #
        # The password file is NOT in this repo and must never be: it lives at
        # /etc/nginx/.htpasswd-dev, root-owned, 0640, nginx-readable. Rotate it
        # with:
        #   printf 'dev:%s\n' "$(openssl passwd -apr1 'NEW-PASSWORD')" \
        #     | sudo tee /etc/nginx/.htpasswd-dev >/dev/null
        auth_basic           "TNL staging — authorised operators only";
        auth_basic_user_file /etc/nginx/.htpasswd-dev;

        # ── Gate 2: the staging instance itself ──────────────────────────────
        #
        # Loopback only. nginx-dev binds 127.0.0.1:8090 and this is the sole
        # route to it.
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # nginx-dev is a `default_server` with `server_name _`, so it does not
        # select on Host the way the production front door does. $host is passed
        # anyway so the API sees the real name in logs and in any absolute URL
        # it builds.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # War room = WebSockets, and staging exists to exercise exactly that.
        #
        # ⚠️ Browsers replay Basic credentials on a same-origin WebSocket
        # handshake, so the gate above does not normally break the socket — but
        # this is the one interaction worth re-checking after any change here.
        # If the roster ever goes silent while the page itself loads, test it
        # before blaming the app:
        #   curl -sSi -u dev:<pw> -o /dev/null -w '%{http_code}\n' \
        #     -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
        #     -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: dGVzdA==' \
        #     https://dev.monchoon.me/ws
        # 101 is the socket upgrading; 401 means the credentials did not ride
        # along and the auth_basic needs lifting off the socket path alone.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $dev_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Belt and braces on the noindex: a crawler that ignores the header still
    # gets a flat refusal, and this one path is deliberately left unauthenticated
    # so it is actually readable.
    location = /robots.txt {
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
