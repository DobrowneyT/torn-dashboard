# files.monchoon.me — public static file host.
#
# Install to /etc/nginx/sites-available/files.monchoon.me on the VPS and
# symlink into sites-enabled. See "Public file hosting" in deploy/README.md.
#
# ── Why this is NOT in Docker ────────────────────────────────────────────────
#
# Everything else we run is a container behind the Docker nginx on
# 127.0.0.1:8088, which proxies to five tenant APIs that can reach Postgres.
# This vhost deliberately sits outside all of that: it is the HOST nginx
# reading files off disk, with no proxy_pass, no container, and no membership
# of any Docker network.
#
# That is the whole security argument. A static file server has no upload
# endpoint, no scripting, and no database credentials — and because it is not
# on the app network, even a compromise of it reaches nothing. Adding a static
# root to the existing tenant vhost would have been fewer moving parts and a
# strictly worse blast radius.
#
# ── Shared box ───────────────────────────────────────────────────────────────
#
# This VPS also serves someone else's sites. Nothing here touches a shared
# name: no `map` blocks (a duplicate map name is a FATAL config error — see the
# $tnl_connection_upgrade note in LAUNCH.md), no `default_server`, no changes to
# nginx.conf. Always `sudo nginx -t` before reloading.

server {
    listen 80;
    listen [::]:80;
    server_name files.monchoon.me;

    root /srv/public-files;

    # Emit `Location: /scripts/` rather than a rebuilt absolute URL. nginx
    # otherwise reconstructs scheme/host/port from the listening socket, which
    # is wrong the moment anything sits in front of it — and it silently sends
    # visitors to the wrong port instead of failing loudly.
    absolute_redirect off;

    # No directory browsing. Everything here is world-readable by design, so
    # the only protection is that you have to know the filename.
    autoindex off;

    # Correct types are already supplied by mime.types (.js →
    # application/javascript, .txt → text/plain, .mp4 → video/mp4), so nosniff
    # is safe and stops a browser second-guessing them.
    add_header X-Content-Type-Options "nosniff" always;

    # Userscripts. Tampermonkey recognises the .user.js suffix and offers to
    # install rather than dumping source at the reader.
    #
    # SHORT cache, deliberately. The dashboard's own /assets/ are cached
    # immutably for a year, which is only safe because Vite content-hashes
    # those filenames. These filenames are stable, so an immutable cache would
    # mean a script could never be updated — and @updateURL auto-updates would
    # silently never fire.
    location ~ \.user\.js$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Plain-text reading copies, for anyone who wants to read a script before
    # installing it.
    location ~ \.txt$ {
        charset utf-8;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Video. nginx serves byte ranges for static files by default, so seeking
    # works without the mp4 module. Cached for a week — these do not change.
    location ~ \.(mp4|webm|m4v)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Dotfiles are never served — stops an editor swapfile or a stray .env
    # copied into the directory becoming a public URL.
    location ~ /\. {
        deny all;
        access_log off;
    }

    # ── Browsable folders ────────────────────────────────────────────────────
    #
    # Listings for these two directories ONLY. The server-level `autoindex off`
    # above stays the default, so nothing else is browsable: `/` still 404s and
    # a future folder is private until it is named here deliberately.
    #
    # These are PREFIX locations, not `^~`. That matters: `^~` would take
    # priority over the regex blocks above, and a `.user.js` inside /scripts/
    # would lose its content type and cache rules. A plain prefix loses to a
    # matching regex, which is exactly right — the directory URI `/scripts/`
    # matches no regex and gets the listing, while `/scripts/x.user.js` matches
    # the regex and gets the script treatment.
    #
    # The generated listing includes a `../` link. It is not an escape hatch:
    # it resolves to `/`, which 404s, and nginx will not serve outside `root`.
    # Without these, `/scripts` (no trailing slash) 404s while `/scripts/` works.
    #
    # `location /scripts/` does not match the URI `/scripts`, so it falls to
    # `location /` below, whose `try_files $uri =404` looks for a FILE of that
    # name, finds a directory, and 404s. nginx's own "add the slash" redirect
    # never fires because try_files bypasses the static handler that issues it.
    #
    # Fixed with exact-match redirects rather than `try_files $uri $uri/`: that
    # would send EVERY directory to the static handler, turning the 404 on a
    # non-browsable folder into a 403 — which confirms the folder exists. A 404
    # for anything not deliberately published is the behaviour we want.
    location = /scripts { return 301 /scripts/; }
    location = /videos  { return 301 /videos/; }

    location /scripts/ {
        autoindex on;
        autoindex_exact_size off;   # "12K", not "12043"
        autoindex_localtime on;     # server-local times, not UTC
        # The FILES are meant to be shared; a crawlable index of everything we
        # have ever uploaded is a different thing.
        add_header X-Robots-Tag "noindex" always;
    }

    location /videos/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        try_files $uri =404;
    }
}
